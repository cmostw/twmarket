name: Docs

on:
  push:
    branches: [main]
    paths: ['src/twmarket/**', 'apps/docs/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['src/twmarket/**', 'apps/docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - run: npm ci
      - run: npm run types:check
      - run: git diff --exit-code -- content/docs/reference/api
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
