[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "twmarket"
version = "0.1.0"
description = "Python data library for Taiwan securities, futures, and options"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "lxml>=5.3,<7",
    "orjson>=3.10,<4",
]

[project.optional-dependencies]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.0,<2",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
    "pyright>=1.1.400,<2",
    "lxml-stubs>=0.5,<1",
    "coverage>=7.6,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/twmarket"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/pyproject.toml", "/LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-m", "not integration"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: opt-in tests against official market-data sources"]

[tool.coverage.run]
branch = true
source = ["twmarket"]

[tool.coverage.report]
precision = 2
show_missing = true
